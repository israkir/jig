# Recipients of the encrypted stores. Add an age public key (age1...), then run
# make secrets-updatekeys. Never commit a private key.
# Production is a different file. A developer key cannot decrypt it.
# Production recipients: the host key at mode 0400 that stays on the host, a
# maintainer, and an offline backup kept outside every repository.
creation_rules:
  - path_regex: secrets/local\.enc\.ya?ml$
    age: age1REPLACE_WITH_A_DEVELOPER_PUBLIC_KEY
  - path_regex: secrets/production\.enc\.ya?ml$
    age: >-
      age1REPLACE_WITH_THE_HOST_PUBLIC_KEY,
      age1REPLACE_WITH_A_MAINTAINER_PUBLIC_KEY,
      age1REPLACE_WITH_THE_OFFLINE_BACKUP_PUBLIC_KEY
