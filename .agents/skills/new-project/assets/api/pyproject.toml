[project]
name = "{{slug}}"
version = "0.1.0"
description = "{{title}} API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.4",
    "pydantic>=2.14.3",
    "uvicorn[standard]>=0.54.0",
    # surface: database
    "alembic>=1.20.1",
    "psycopg[binary]>=3.3.8",
    "sqlalchemy>=2.1.8",
    # end surface: database
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["app"]
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
